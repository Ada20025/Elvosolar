name: Deploy to Alwaysdata

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Deploy ELVOCONTROL APP to app.elvosolar.sk
    - name: Deploy App
      uses: burnett01/rsync-deployments@7.0.1
      with:
        switches: -avzr --delete
        path: Software/App/
        remote_path: /www/app.elvosolar.sk/
        remote_host: ${{ secrets.ALWAYSDATA_HOST }}
        remote_user: ${{ secrets.ALWAYSDATA_USER }}
        remote_key: ${{ secrets.ALWAYSDATA_SSH_KEY }}

    # Deploy ELVOSOLAR WEBSITE to www.elvosolar.sk
    - name: Deploy Website
      uses: burnett01/rsync-deployments@7.0.1
      with:
        switches: -avzr --delete
        path: Software/Web/www.elvosolar.sk/
        remote_path: /www/www.elvosolar.sk/
        remote_host: ${{ secrets.ALWAYSDATA_HOST }}
        remote_user: ${{ secrets.ALWAYSDATA_USER }}
        remote_key: ${{ secrets.ALWAYSDATA_SSH_KEY }}
