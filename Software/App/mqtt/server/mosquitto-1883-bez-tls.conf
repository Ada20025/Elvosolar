# =============================================================================
# Mosquitto — prevádzka BEZ certifikátu (port 1883)
# Použitie, kým nie je Let's Encrypt certifikát pre doménu:
#   sudo cp mosquitto-1883-bez-tls.conf /etc/mosquitto/conf.d/elvo.conf
#   sudo systemctl restart mosquitto
#
# Pozor: tento listener je otvorený do internetu a NIE JE šifrovaný —
# heslá aj príkazy idú v čitateľnej podobe. Po zisku certifikátu prejdi
# na mosquitto.conf (8883 + TLS) a 1883 zavri.
# =============================================================================

per_listener_settings true

# --- Listener pre web (Websupport) aj zariadenia CM5 v teréne ---
listener 1883
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.txt

# --- Perzistencia: retained príkazy a QoS1 fronta prežijú reštart ---
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

# --- Fronta pre zariadenia, ktoré práve stratili spojenie ---
max_queued_messages 1000
max_inflight_messages 20

# --- Malé správy stačia (STROJ_START / STATUS_BEZI) ---
message_size_limit 65536

# --- Logovanie (audit: kto sa pripojil a odkiaľ) ---
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
sys_interval 60
