# =============================================================================
# Mosquitto — MOZOG systému ElvoControll (firemný Linux server)
# Slúži pre 1 000+ zariadení CM5: retained príkazy + stavy, minimálna RAM/CPU.
#
# Inštalácia:
#   sudo apt install mosquitto
#   sudo cp mosquitto.conf /etc/mosquitto/conf.d/elvo.conf
#   sudo cp acl.txt /etc/mosquitto/acl.txt
#   (heslá vytvorí add_device.sh)
#   sudo systemctl restart mosquitto
# =============================================================================

# --- Stav systému: log pre audit a per-listener nastavenia ---
per_listener_settings true

# ---------------------------------------------------------------------------
# LISTENER 1: TLS (port 8883) — zariadenia CM5 v teréne + web na Websupporte
# Spojenie nadväzuje ZARIADENIE smerom von -> funguje cez každý NAT/firewall.
# ---------------------------------------------------------------------------
listener 8883
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.txt

# TLS certifikáty (Let's Encrypt — certbot certonly --standalone -d <subdoména>)
certfile /etc/mosquitto/certs/fullchain.pem
keyfile  /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2

# ---------------------------------------------------------------------------
# LISTENER 2: administrácia (port 1883) IBA z localhostu — mosquitto_pub/sub
# na serveri pre testy a správu. Nikdy neotvárať do internetu!
# ---------------------------------------------------------------------------
listener 1883 127.0.0.1
protocol mqtt
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl.txt

# ---------------------------------------------------------------------------
# VÝKON A SPOĽAHLIVOSŤ PRE 1 000+ ZARIADENÍ
# ---------------------------------------------------------------------------
# Perzistencia: retained príkazy a session QoS1 prežijú reštart servera
persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 300

# Fronta správ pre offline zariadenia (QoS1 doručí po návode na internet)
max_queued_messages 1000
max_inflight_messages 20

# Ochrana: malé správy stačia (STROJ_START / STATUS_BEZI)
message_size_limit 65536

# Telemetria brokera do logu raz za minútu (nie častejšie)
sys_interval 60

# Log (audit: kto sa pripojil/odpojil)
log_dest file /var/log/mosquitto/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
