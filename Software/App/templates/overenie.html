    <script>
        const inputs = Array.from(document.querySelectorAll('.code-input'));
        const form = document.getElementById('verifyForm');
        const fullCode = document.getElementById('fullCode');
        const submitBtn = document.getElementById('submitBtn');

        function syncState() {
            inputs.forEach((inp, i) => inp.classList.toggle('filled', !!inp.value));
            fullCode.value = inputs.map(i => i.value).join('');
            if (fullCode.value.length === 6 && !fullCode.value.includes(' ')) {
                setTimeout(() => { submitBtn.disabled = true; form.submit(); }, 180);
            }
        }
        inputs.forEach((inp, i) => {
            inp.addEventListener('input', () => {
                inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
                if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
                syncState();
            });
            inp.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !inp.value && i > 0) { inputs[i - 1].focus(); inputs[i - 1].value = ''; syncState(); e.preventDefault(); }
                if (e.key === 'ArrowLeft' && i > 0) inputs[i - 1].focus();
                if (e.key === 'ArrowRight' && i < inputs.length - 1) inputs[i + 1].focus();
            });
            inp.addEventListener('paste', (e) => {
                e.preventDefault();
                const text = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
                for (let j = 0; j < text.length; j++) inputs[j].value = text[j];
                inputs[Math.min(text.length, 5)].focus();
                syncState();
            });
        });
        inputs[0].focus();

        // Resend countdown 60s
        const resendBtn = document.getElementById('resendBtn');
        const timerEl = document.getElementById('timer');
        let secs = 60;
        resendBtn.classList.add('disabled');
        const tick = setInterval(() => {
            secs--;
            if (secs <= 0) { clearInterval(tick); resendBtn.classList.remove('disabled'); timerEl.textContent = ''; }
            else { resendBtn.classList.add('disabled'); timerEl.textContent = 'Nový kód možno požiadať za ' + secs + ' s'; }
        }, 1000);
    </script>
