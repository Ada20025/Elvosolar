<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prihlásenie | ElvoControl</title>
    <link rel="icon" type="image/png" href="/templates/ElvosolarLogo.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            background: #020617;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Solar panel background photo */
        .bg-photo {
            position: fixed;
            inset: 0;
            background-image: url('/templates/Fotovoltika1.jpg');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }
        .bg-photo::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(2,6,23,.88), rgba(15,23,42,.82), rgba(99,102,241,.15));
        }

        /* Animated gradient orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }
        .bg-orb-1 { width: 600px; height: 600px; background: #6366f1; top: -200px; left: -200px; animation-delay: 0s; }
        .bg-orb-2 { width: 500px; height: 500px; background: #3b82f6; bottom: -200px; right: -150px; animation-delay: -7s; }
        .bg-orb-3 { width: 350px; height: 350px; background: #8b5cf6; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: -14s; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -40px) scale(1.05); }
            66% { transform: translate(-20px, 30px) scale(0.95); }
        }

        /* Grid pattern overlay */
        .grid-pattern {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        /* Login container */
        .login-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 440px;
            padding: 20px;
        }

        /* Glass card */
        .glass-card {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 24px;
            padding: 48px 40px;
            box-shadow: 
                0 0 0 1px rgba(255,255,255,0.03),
                0 25px 50px -12px rgba(0, 0, 0, 0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
            animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Logo area */
        .logo-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            box-shadow: 0 0 30px rgba(6, 182, 212, 0.3);
        }

        .logo-icon svg { width: 28px; height: 28px; color: white; }

        .logo-text {
            font-size: 24px;
            font-weight: 900;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f8fafc, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .logo-sub {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #6366f1;
            margin-top: 4px;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Form */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 16px;
            color: #475569;
            pointer-events: none;
            transition: color 0.2s;
        }

        .input-wrapper:focus-within .input-icon { color: #6366f1; }

        .form-input {
            width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 14px 16px 14px 48px;
            font-size: 14px;
            font-weight: 600;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            outline: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-input::placeholder { color: #475569; font-weight: 500; }

        .form-input:focus {
            border-color: rgba(6, 182, 212, 0.5);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.1), 0 0 20px rgba(6, 182, 212, 0.1);
            background: rgba(15, 23, 42, 1);
        }

        /* Password toggle */
        .toggle-pw {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .toggle-pw:hover { color: #818cf8; background: rgba(99,102,241,0.08); }
        .toggle-pw:active { transform: scale(0.9); }
        .toggle-pw svg { width: 20px; height: 20px; transition: all 0.2s; }

        /* Submit button */
        .submit-btn {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border: none;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            font-weight: 800;
            font-family: 'Plus Jakarta Sans', sans-serif;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
            letter-spacing: 0.5px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(6, 182, 212, 0.4);
        }

        .submit-btn:active {
            transform: translateY(0) scale(0.98);
        }

        /* Links */
        .form-links {
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
        }

        .form-link {
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            text-decoration: none;
            transition: color 0.2s;
        }
        .form-link:hover { color: #6366f1; }

        /* Flash messages */
        .flash-msg {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            animation: flashIn 0.4s ease-out;
        }
        .flash-error {
            background: rgba(244, 63, 94, 0.1);
            border: 1px solid rgba(244, 63, 94, 0.2);
            color: #fb7185;
        }
        .flash-success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.2);
            color: #34d399;
        }

        @keyframes flashIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        .login-footer {
            text-align: center;
            margin-top: 32px;
            font-size: 11px;
            color: #334155;
        }
        .login-footer a { color: #475569; text-decoration: none; transition: color 0.2s; }
        .login-footer a:hover { color: #6366f1; }

        /* Responsive */
        .hidden { display: none !important; }

        @media (max-width: 480px) {
            .glass-card { padding: 36px 24px; }
            .logo-text { font-size: 20px; }
        }
    </style>
</head>
<body>
    <!-- Solar panel background photo -->
    <div class="bg-photo"></div>

    <!-- Animated background -->
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    <div class="bg-orb bg-orb-3"></div>
    <div class="grid-pattern"></div>

    <!-- Login card -->
    <div class="login-container">
        <div class="glass-card">
            <div class="logo-area">
                <img src="/templates/ElvosolarLogo.png" alt="ElvoControl" style="height:56px;width:auto;border-radius:16px;margin-bottom:20px;filter:drop-shadow(0 0 20px rgba(99,102,241,.4));">
                <div class="logo-text">ElvoControl</div>
                <div class="logo-sub">Smart EMS Pro</div>
            </div>

            <!-- Flash messages -->
            <?php if (!empty($flash)): ?>
                <?php foreach ($flash as $msg): ?>
                    <div class="flash-msg <?php echo $msg['category'] === 'error' ? 'flash-error' : 'flash-success'; ?>">
                        <?php echo htmlspecialchars($msg['message']); ?>
                    </div>
                <?php endforeach; ?>
            <?php endif; ?>

            <form method="POST" action="<?php echo $base_path; ?>/login">
                <div class="form-group">
                    <label class="form-label">E-mailová adresa</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                            </svg>
                        </span>
                        <input type="email" name="email" class="form-input" placeholder="vas@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">Heslo</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </span>
                        <input id="pw" type="password" name="password" class="form-input" style="padding-right: 48px;" placeholder="••••••••" required>
                        <button type="button" onclick="togglePw()" class="toggle-pw">
                            <svg id="eye-open" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                            </svg>
                            <svg id="eye-closed" class="hidden" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">Prihlásiť sa</button>
            </form>

            <div class="form-links">
                <a href="<?php echo $base_path; ?>/register" class="form-link">Vytvoriť profil</a>
                <a href="<?php echo $base_path; ?>/forgot-password" class="form-link">Zabudli ste heslo?</a>
            </div>
        </div>

        <div class="login-footer">
            &copy; 2011–2026 Elvosolar. Všetky práva vyhradené.<br>
            <a href="/templates/ochrana-osobnych-udajov.pdf" target="_blank">Ochrana osobných údajov</a>
        </div>
    </div>

    <script>
        function togglePw() {
            const pw = document.getElementById('pw');
            const open = document.getElementById('eye-open');
            const closed = document.getElementById('eye-closed');
            if (pw.type === 'password') {
                pw.type = 'text';
                open.classList.add('hidden');
                closed.classList.remove('hidden');
            } else {
                pw.type = 'password';
                open.classList.remove('hidden');
                closed.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
