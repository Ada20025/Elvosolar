        <script>
            // Stabilny fingerprint zariadenia pre trusted-device overenie
            (function() {
                try {
                    var did = localStorage.getItem('elvo_device_id');
                    if (!did) {
                        did = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 10);
                        localStorage.setItem('elvo_device_id', did);
                    }
                    var inp = document.getElementById('deviceIdInput');
                    if (inp) inp.value = did;
                } catch (e) { /* localStorage unavailable - UA fallback na serveri */ }
            })();

            // PWA install prompt
            var deferredInstallPrompt = null;
            
            // Ukaz "Stiahnut app" iba v prehladaci (nie PWA)
            var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
            var installBtn = document.getElementById('installAppBtn');
            
            if (!isPWA && installBtn) {
                installBtn.style.display = 'block';
                
                window.addEventListener('beforeinstallprompt', function(e) {
                    e.preventDefault();
                    deferredInstallPrompt = e;
                });
                
                function triggerInstall() {
                    if (deferredInstallPrompt) {
                        deferredInstallPrompt.prompt();
                        deferredInstallPrompt.userChoice.then(function(choice) {
                            if (choice.outcome === 'accepted') {
                                installBtn.style.display = 'none';
                            }
                            deferredInstallPrompt = null;
                        });
                    } else {
                        // Fallback: presmeruj na /install stranku
                        window.location.href = '/install';
                    }
                }
            }
        </script>

    <script>
        function togglePw() {
            const pw = document.getElementById('pw');
            const open = document.getElementById('eye-open');
            const closed = document.getElementById('eye-closed');
            if (pw.type === 'password') {
                pw.type = 'text';
                open.classList.add('hidden');
                closed.classList.remove('hidden');
            } else {
                pw.type = 'password';
                open.classList.remove('hidden');
                closed.classList.add('hidden');
            }
        }
    </script>
