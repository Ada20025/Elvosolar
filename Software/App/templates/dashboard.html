<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 120" width="100%" height="100%">
  <!-- Pozadie (voliteľné, pre tmavý režim) -->
  <rect width="100%" height="100%" fill="#080c14" rx="16"/>

  <g transform="translate(20, 15)">
    <!-- Grafický symbol: List skombinovaný s písmenom B -->
    <g transform="translate(10, 5)">
      <!-- Vonkajší ochranný prstenec / kruh -->
      <circle cx="40" cy="40" r="38" fill="none" stroke="rgba(16, 185, 129, 0.2)" stroke-width="2"/>
      
      <!-- Symbol listu a línie B -->
      <path d="M25,20 C25,20 45,15 55,30 C65,45 55,60 55,60 C55,60 35,65 25,50 C15,35 25,20 25,20 Z" 
            fill="none" 
            stroke="#10b981" 
            stroke-width="4.5" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>
      
      <!-- Vnútorná žilnatina listu dotvárajúca bruško písmena B -->
      <path d="M25,50 C32,45 45,45 55,30 M25,20 L55,60" 
            fill="none" 
            stroke="#818cf8" 
            stroke-width="3" 
            stroke-linecap="round"/>
      
      <!-- Vertikálny kmeň dotvárajúci písmeno B -->
      <line x1="25" y1="15" x2="25" y2="65" stroke="#10b981" stroke-width="4.5" stroke-linecap="round"/>
    </g>

    <!-- Textová časť loga -->
    <g transform="translate(110, 48)">
      <!-- Hlavný názov značky -->
      <text font-family="'Plus Jakarta Sans', 'Segoe UI', sans-serif" 
            font-size="38" 
            font-weight="900" 
            fill="#f9fafb" 
            letter-spacing="0.5">Biok</text>
      
      <!-- Bodka na konci pre moderný akcent -->
      <circle cx="92" cy="-8" r="4.5" fill="#10b981"/>
      
      <!-- Sub-label / Slogan -->
      <text y="22" 
            font-family="'JetBrains Mono', monospace" 
            font-size="10" 
            font-weight="700" 
            fill="#6b7280" 
            letter-spacing="3.5">ECOLOGICAL INNOVATION</text>
    </g>
  </g>
</svg>
