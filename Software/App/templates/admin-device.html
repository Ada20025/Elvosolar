<!DOCTYPE html>
<html lang="sk" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Správa zariadenia | ElvoControl Admin</title>
    <link rel="icon" type="image/png" href="/templates/ElvosolarLogo.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(51, 65, 85, 0.3); }
        .glow-green { box-shadow: 0 0 20px rgba(16, 185, 129, 0.15); }
        .glow-red { box-shadow: 0 0 20px rgba(239, 68, 68, 0.15); }
    </style>
</head>
<body class="min-h-screen bg-slate-950">

    <!-- NAV -->
    <nav class="glass border-b border-slate-800 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-4">
            <a href="/dashboard" class="text-slate-400 hover:text-white transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <h1 class="text-sm font-bold text-white" id="deviceName">Načítavam...</h1>
        </div>
        <div class="flex items-center gap-3">
            <span id="statusBadge" class="px-3 py-1 rounded-full text-[10px] font-bold uppercase">...</span>
            <a href="/profile" class="text-xs text-slate-400 hover:text-white transition">Profil</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto p-6 space-y-6">

        <!-- HLAVICKA ZARIADENIA -->
        <div class="glass rounded-2xl p-6" id="deviceHeader">
            <div class="flex flex-col md:flex-row justify-between items-start gap-4">
                <div>
                    <h2 class="text-xl font-bold text-white" id="devTitle">...</h2>
                    <p class="text-sm text-slate-400 mt-1">SN: <span id="devSN" class="font-mono text-cyan-400">...</span></p>
                    <p class="text-xs text-slate-500 mt-1">Značka: <span id="devBrand">...</span> • Model: <span id="devModel">...</span> • Slave ID: <span id="devSlaveId">...</span></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="sendCommand('restart_services')" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition">🔄 Restart</button>
                    <button onclick="sendCommand('discover')" class="px-4 py-2 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl transition">🔍 Discover</button>
                    <button onclick="sendCommand('reboot_pi')" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl transition">⚡ Reboot</button>
                    <button onclick="deleteDevice()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold rounded-xl transition">🗑️ Odstrániť</button>
                </div>
            </div>
        </div>

        <!-- LIVE DATA + TELEMETRIA -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div class="glass rounded-2xl p-5 glow-green">
                <span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Výkon AC</span>
                <p class="text-2xl font-black text-white font-mono mt-1" id="livePower">-- kW</p>
            </div>
            <div class="glass rounded-2xl p-5">
                <span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Batéria SOC</span>
                <p class="text-2xl font-black text-cyan-400 font-mono mt-1" id="liveSoc">-- %</p>
            </div>
            <div class="glass rounded-2xl p-5">
                <span class="text-[9px] text-slate-400 uppercase font-bold tracking-wider">Teplota</span>
                <p class="text-2xl font-black text-amber-400 font-mono mt-1" id="liveTemp">-- °C</p>
            </div>
        </div>

        <!-- MODBUS TERMINAL -->
        <div class="glass rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800 flex justify-between items-center">
                <h3 class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Modbus Terminal</h3>
                <span class="text-[10px] text-slate-500" id="terminalTarget">...</span>
            </div>
            <div class="p-4 space-y-3">
                <div id="terminalConsole" class="h-40 bg-slate-950 rounded-xl border border-slate-800 p-3 font-mono text-[11px] text-cyan-400 overflow-y-auto space-y-1">
                    <div class="text-slate-600">[System] Modbus terminal pripravený.</div>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="terminalInput" onkeydown="if(event.key==='Enter')runTerminal()" placeholder="read 32080 / write 40125 1" class="flex-grow bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs font-mono text-white outline-none focus:border-cyan-500">
                    <button onclick="runTerminal()" class="px-5 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl transition">Spustiť</button>
                </div>
                <div class="flex flex-wrap gap-1.5">
                    <button onclick="fillCmd('read 32080')" class="px-3 py-1 bg-slate-900 border border-slate-800 text-[10px] font-bold rounded-lg text-slate-300 hover:bg-slate-800 transition">Výkon AC</button>
                    <button onclick="fillCmd('read 37760')" class="px-3 py-1 bg-slate-900 border border-slate-800 text-[10px] font-bold rounded-lg text-slate-300 hover:bg-slate-800 transition">SOC Batérie</button>
                    <button onclick="fillCmd('read 40125')" class="px-3 py-1 bg-slate-900 border border-slate-800 text-[10px] font-bold rounded-lg text-slate-300 hover:bg-slate-800 transition">Stav meniča</button>
                    <button onclick="fillCmd('write 40125 1')" class="px-3 py-1 bg-slate-900 border border-slate-800 text-[10px] font-bold rounded-lg text-emerald-400 hover:bg-slate-800 transition">Zapnúť</button>
                    <button onclick="fillCmd('write 40125 0')" class="px-3 py-1 bg-slate-900 border border-slate-800 text-[10px] font-bold rounded-lg text-rose-400 hover:bg-slate-800 transition">Vypnúť</button>
                </div>
            </div>
        </div>

        <!-- HISTORIA TELEMETRIE -->
        <div class="glass rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800">
                <h3 class="text-xs font-bold text-white uppercase tracking-wider">📈 História telemetrie</h3>
            </div>
            <div class="p-4">
                <div id="telemetryChart" class="h-48 bg-slate-950 rounded-xl border border-slate-800 flex items-center justify-center text-slate-600 text-xs">
                    Načítavam dáta...
                </div>
            </div>
        </div>

        <!-- NASTAVENIA ZARIADENIA -->
        <div class="glass rounded-2xl p-6">
            <h3 class="text-xs font-bold text-white uppercase tracking-wider mb-4">⚙️ Nastavenia zariadenia</h3>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold">Názov zariadenia</label>
                    <input type="text" id="deviceNameInput" class="w-full bg-slate-900/50 border border-slate-800 text-white text-sm rounded-xl px-4 py-2.5 mt-1 outline-none focus:border-cyan-500">
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold">Režim prevádzky</label>
                    <select id="operationMode" class="w-full bg-slate-900/50 border border-slate-800 text-white text-sm rounded-xl px-4 py-2.5 mt-1 outline-none focus:border-cyan-500">
                        <option value="AUTO">AUTO</option>
                        <option value="ON">Vynútiť ON</option>
                        <option value="OFF">Vynútiť OFF</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold">Nočný spánok</label>
                    <select id="nightSleep" class="w-full bg-slate-900/50 border border-slate-800 text-white text-sm rounded-xl px-4 py-2.5 mt-1 outline-none focus:border-cyan-500">
                        <option value="0">Vypnutý</option>
                        <option value="1">Zapnutý</option>
                    </select>
                </div>
                <div>
                    <label class="text-[10px] text-slate-400 uppercase font-bold">Skupina</label>
                    <select id="deviceGroup" class="w-full bg-slate-900/50 border border-slate-800 text-white text-sm rounded-xl px-4 py-2.5 mt-1 outline-none focus:border-cyan-500">
                        <option value="">Žiadna skupina</option>
                    </select>
                </div>
            </div>
            <button onclick="saveDeviceSettings()" class="mt-4 px-6 py-2.5 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold rounded-xl transition">Uložiť nastavenia</button>
        </div>

    </div>

    <script>
        const deviceId = window.location.pathname.split('/').pop();
        let deviceData = {};

        async function loadDevice() {
            try {
                const res = await fetch(`/api/admin/devices`);
                const data = await res.json();
                if (data.status === 'success') {
                    deviceData = data.devices.find(d => d.id == deviceId);
                    if (deviceData) renderDevice();
                }
            } catch(e) { console.error(e); }
        }

        function renderDevice() {
            const d = deviceData;
            document.getElementById('deviceName').textContent = d.name;
            document.getElementById('devTitle').textContent = d.name;
            document.getElementById('devSN').textContent = d.serial_number;
            document.getElementById('devBrand').textContent = d.brand_id;
            document.getElementById('devModel').textContent = d.model_id;
            document.getElementById('devSlaveId').textContent = d.slave_id;
            document.getElementById('deviceNameInput').value = d.name;
            document.getElementById('terminalTarget').textContent = `Target: ${d.serial_number} (ID ${d.slave_id})`;

            const isOnline = d.is_online;
            const badge = document.getElementById('statusBadge');
            if (isOnline) {
                badge.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                badge.textContent = 'Online';
                document.getElementById('deviceHeader').className = 'glass rounded-2xl p-6 glow-green';
            } else {
                badge.className = 'px-3 py-1 rounded-full text-[10px] font-bold uppercase bg-slate-700/50 text-slate-400 border border-slate-700/30';
                badge.textContent = 'Offline';
            }

            document.getElementById('livePower').textContent = d.power_ac ? (d.power_ac / 1000).toFixed(2) + ' kW' : '0.00 kW';
            document.getElementById('liveSoc').textContent = d.battery_soc ? d.battery_soc.toFixed(0) + ' %' : '-- %';
            document.getElementById('liveTemp').textContent = d.temp ? d.temp.toFixed(1) + ' °C' : '-- °C';
        }

        async function sendCommand(action) {
            try {
                const res = await fetch('/api/admin/command', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ device_id: deviceId, action: action, params: {} })
                });
                const data = await res.json();
                alert(data.status === 'success' ? `✅ ${data.message}` : `❌ ${data.message}`);
            } catch(e) { alert('Chyba: ' + e.message); }
        }

        async function deleteDevice() {
            if (!confirm('Naozaj chcete odstrániť toto zariadenie?')) return;
            try {
                const res = await fetch(`/api/admin/device/${deviceId}`, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'success') { alert('Zariadenie odstránené'); window.location.href = '/dashboard'; }
                else alert(data.message);
            } catch(e) { alert('Chyba: ' + e.message); }
        }

        function fillCmd(cmd) { document.getElementById('terminalInput').value = cmd; }

        async function runTerminal() {
            const input = document.getElementById('terminalInput');
            const cmd = input.value.trim();
            if (!cmd) return;
            input.value = '';
            const console = document.getElementById('terminalConsole');
            console.innerHTML += `<div class="text-white">> ${cmd}</div>`;

            const parts = cmd.split(' ');
            const action = parts[0].toLowerCase();

            try {
                if (action === 'read') {
                    const reg = parseInt(parts[1]);
                    const res = await fetch(`/api/device/${deviceId}/telemetry`);
                    const data = await res.json();
                    let val = '--';
                    if (reg === 32080) val = data.total_live_power ? (data.total_live_power / 1000).toFixed(2) + ' kW' : '0 kW';
                    else if (reg === 37760) val = (data.avg_live_soc || 0).toFixed(0) + ' %';
                    else if (reg === 40125) val = data.manual_override || 'AUTO';
                    else val = JSON.stringify(data).substring(0, 100);
                    console.innerHTML += `<div class="text-emerald-400">✅ Register ${reg}: ${val}</div>`;
                } else if (action === 'write') {
                    const reg = parseInt(parts[1]);
                    const val = parseInt(parts[2]);
                    await fetch(`/api/system/inverter-power`, {
                        method: 'POST', headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ power_status: val > 0 ? 'ON' : (val === 0 ? 'OFF' : 'AUTO') })
                    });
                    console.innerHTML += `<div class="text-cyan-400">✅ Register ${reg} nastavený na ${val}</div>`;
                } else {
                    console.innerHTML += `<div class="text-rose-400">❌ Neznámy príkaz</div>`;
                }
            } catch(e) {
                console.innerHTML += `<div class="text-rose-400">❌ Chyba: ${e.message}</div>`;
            }
            console.scrollTop = console.scrollHeight;
        }

        async function saveDeviceSettings() {
            try {
                const res = await fetch(`/api/admin/device/${deviceId}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        name: document.getElementById('deviceNameInput').value,
                        operation_mode: document.getElementById('operationMode').value,
                        night_sleep: document.getElementById('nightSleep').value,
                        group: document.getElementById('deviceGroup').value,
                    })
                });
                const data = await res.json();
                alert(data.status === 'success' ? '✅ Nastavenia uložené' : '❌ ' + data.message);
            } catch(e) { alert('Chyba: ' + e.message); }
        }

        // Push notification registration
        async function registerPush() {
            if (!('Notification' in window)) return;
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                console.log('Push notifikácie povolené');
            }
        }

        function showPushNotification(title, body, icon) {
            if (Notification.permission === 'granted') {
                new Notification(title, { body: body, icon: icon || '/templates/ElvosolarLogo.png' });
            }
        }

        // Auto-refresh
        loadDevice();
        setInterval(loadDevice, 10000);
    </script>
</body>
</html>
