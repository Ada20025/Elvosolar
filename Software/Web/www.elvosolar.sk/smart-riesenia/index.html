    <!-- Skripty -->
    <script>
        // Mobilné menu (Hamburger)
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');

        mobileMenuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.contains('hidden');
            if (isHidden) {
                mobileMenu.classList.remove('hidden');
                hamburgerIcon.setAttribute('d', 'M6 18L18 6M6 6l12 12');
            } else {
                mobileMenu.classList.add('hidden');
                hamburgerIcon.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
            }
        });

        // Dropdown pre výber jazyka
        const langMenuBtn = document.getElementById('lang-menu-btn');
        const langDropdown = document.getElementById('lang-dropdown');

        langMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeDropdowns();
            langDropdown.classList.toggle('hidden');
        });

        // Dropdown pre Obnoviteľnú energiu (Desktop)
        const renewableMenuBtn = document.getElementById('renewable-menu-btn');
        const renewableDropdown = document.getElementById('renewable-dropdown');

        renewableMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeDropdowns();
            renewableDropdown.classList.toggle('hidden');
        });

        // Akordeón pre Obnoviteľnú energiu (Mobile)
        const mobileRenewableMenuBtn = document.getElementById('mobile-renewable-menu-btn');
        const mobileRenewableSubmenu = document.getElementById('mobile-renewable-submenu');

        mobileRenewableMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileRenewableSubmenu.classList.toggle('hidden');
        });

        // Pomocná funkcia na zatvorenie otvorených desktop dropdownov
        function closeDropdowns() {
            langDropdown.classList.add('hidden');
            renewableDropdown.classList.add('hidden');
        }

        // Zatvorenie všetkých dropdownov pri kliknutí mimo nich
        document.addEventListener('click', () => {
            closeDropdowns();
        });

        // ----------------- LOKALIZAČNÝ ENGINE -----------------
        let currentTranslations = {};
        let currentLang = localStorage.getItem('elvo_lang') || 'sk';

        async function loadLanguage(lang) {
            let fetchedData = null;
            try {
                const response = await fetch(`../preklad/${lang.toUpperCase()}/index.json`);
                if (response.ok) {
                    fetchedData = await response.json();
                }
            } catch (error) {
                console.warn("Spustené lokálne (CORS pravidlo). Načítava sa vstavaná záloha slovníka.");
            }

            if (!fetchedData) {
                fetchedData = fullEmbeddedTranslations[lang] || localFallbackTranslations[lang];
            }

            currentTranslations = fetchedData;
            applyTranslations(fetchedData, lang);
        }

        function applyTranslations(dictionary, lang) {
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                const value = getNestedValue(dictionary, key);
                if (value !== undefined) {
                    el.innerHTML = value;
                }
            });

            document.querySelectorAll('[data-translate-placeholder]').forEach(el => {
                const key = el.getAttribute('data-translate-placeholder');
                const value = getNestedValue(dictionary, key);
                if (value !== undefined) {
                    el.setAttribute('placeholder', value);
                }
            });

            document.documentElement.lang = lang;
            document.getElementById('current-lang').innerText = lang.toUpperCase();
            localStorage.setItem('elvo_lang', lang);
            currentLang = lang;

            updateCartUI();
        }

        function changeLang(lang) {
            loadLanguage(lang);
        }

        function getNestedValue(obj, path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        }

        // ----------------- LOGIKA KOŠÍKA -----------------
        let cart = JSON.parse(localStorage.getItem('elvo_cart')) || [];

        function toggleCartDrawer() {
            const drawer = document.getElementById('cart-drawer');
            const backdrop = document.getElementById('cart-backdrop');
            const panel = document.getElementById('cart-panel');

            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                setTimeout(() => {
                    backdrop.classList.replace('opacity-0', 'opacity-100');
                    panel.classList.replace('translate-x-full', 'translate-x-0');
                }, 10);
            } else {
                backdrop.classList.replace('opacity-100', 'opacity-0');
                panel.classList.replace('translate-x-0', 'translate-x-full');
                setTimeout(() => {
                    drawer.classList.add('hidden');
                }, 300);
            }
        }

        function addToCart(id, price, img, translationKey) {
            const existingItemIndex = cart.findIndex(item => item.id === id);
            if (existingItemIndex > -1) {
                cart[existingItemIndex].quantity += 1;
            } else {
                cart.push({ id, price, img, translationKey, quantity: 1 });
            }
            saveCart();
            updateCartUI();
            if (document.getElementById('cart-drawer').classList.contains('hidden')) {
                toggleCartDrawer();
            }
        }

        function changeQuantity(id, delta) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += delta;
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                saveCart();
                updateCartUI();
            }
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartUI();
        }

            localStorage.setItem('elvo_cart', JSON.stringify(cart));

            if (cart.length === 0) {

                `;
                cartIconBtn.classList.add('hidden');
            } else {
                cart.forEach(item => {
                    totalQuantity += item.quantity;
                    totalPrice += item.price * item.quantity;

                    // Dynamický preklad názvu produktu v košíku
                    const translatedName = getNestedValue(currentTranslations, item.translationKey) || item.translationKey;

                    const itemElement = document.createElement('div');

                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />

            const formatterLang = currentLang === 'sk' ? 'sk-SK' : 'en-US';

        function handleCheckout(event) {
            event.preventDefault();
            const name = document.getElementById('checkout-name').value;
            const email = document.getElementById('checkout-email').value;

            if (cart.length === 0) return;

            let itemsSummary = cart.map(item => {
                const translatedName = getNestedValue(currentTranslations, item.translationKey) || item.translationKey;
                return `- ${translatedName} (${item.quantity}x)`;
            }).join('\n');

            const dictionary = currentTranslations || fullEmbeddedTranslations[currentLang] || fullEmbeddedTranslations['sk'];
            const alertThankYou = getNestedValue(dictionary, 'cart.alert_thank_you') || "Ďakujeme za váš dopyt, {name}!";
            const alertReceived = getNestedValue(dictionary, 'cart.alert_received') || "Na e-mail {email} sme zaznamenali záujem o produkty:";
            const alertContact = getNestedValue(dictionary, 'cart.alert_contact') || "Čoskoro vás budeme kontaktovať.";

            const formattedThankYou = alertThankYou.replace('{name}', name);
            const formattedReceived = alertReceived.replace('{email}', email);

            alert(`${formattedThankYou}\n\n${formattedReceived}\n${itemsSummary}\n\n${alertContact}`);
            
            cart = [];
            saveCart();
            updateCartUI();
            toggleCartDrawer();
            document.getElementById('checkout-form').reset();
        }

    <!-- Scroll Reveal + Back to Top -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const revealElements = document.querySelectorAll('section > div, .card-premium, main > div');
            const revealObserver = new IntersectionObserver((entries) => {
                entries.forEach((entry, i) => {
                    if (entry.isIntersecting) {
                        setTimeout(() => {
                            entry.target.style.opacity = '1';
                            entry.target.style.transform = 'translateY(0)';
                        }, i * 80);
                        revealObserver.unobserve(entry.target);
                    }
                });
            }, { threshold: 0.08 });
            revealElements.forEach(el => {
                el.style.opacity = '0';
                el.style.transform = 'translateY(20px)';
                el.style.transition = 'all 0.6s cubic-bezier(0.4, 0, 0.2, 1)';
                revealObserver.observe(el);
            });

            // Back to Top
            const backToTop = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) backToTop.classList.add('show');
                else backToTop.classList.remove('show');
            });
        });
    </script>
