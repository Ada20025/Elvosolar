        <div class="max-w-4xl mx-auto px-6">
            <div class="bg-slate-50 p-8 md:p-10 rounded-2xl border border-slate-100">
                <h3 class="text-2xl font-bold text-brand-dark mb-2" data-translate="orc_page.form_title"></h3>
                <p class="text-sm text-slate-500 mb-8" data-translate="orc_page.form_desc"></p>

                <form id="orc-inquiry-form" onsubmit="handleFormSubmit(event)" class="space-y-6">
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" data-translate="orc_page.form_name"></label>
                            <input type="text" id="form-name" required class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-green transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" data-translate="orc_page.form_email"></label>
                            <input type="email" id="form-email" required class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-green transition-colors">
                        </div>
                    </div>

                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" data-translate="orc_page.form_phone"></label>
                            <input type="tel" id="form-phone" required class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-green transition-colors">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" data-translate="orc_page.form_request_type"></label>
                            <select id="form-request" class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-green transition-colors">
                                <option value="info" data-translate="orc_page.form_req_opt1"></option>
                                <option value="meeting" data-translate="orc_page.form_req_opt2"></option>
                                <option value="quote" data-translate="orc_page.form_req_opt3"></option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2" data-translate="orc_page.form_question"></label>
                        <textarea id="form-message" rows="4" required class="w-full bg-white border border-slate-200 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-brand-green transition-colors"></textarea>
                    </div>

                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pt-2">
                        <span class="text-xs text-slate-400" data-translate="orc_page.form_required"></span>
                        <button type="submit" class="bg-brand-dark hover:bg-slate-800 text-white font-bold px-8 py-3.5 rounded-lg text-sm transition-all hover:scale-[1.01]" data-translate="orc_page.form_submit"></button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <!-- Nákupný košík -->
    <div id="cart-drawer" class="fixed inset-0 z-50 pointer-events-none hidden" role="dialog" aria-modal="true">
        <div id="cart-backdrop" onclick="toggleCartDrawer()" class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm opacity-0 transition-opacity duration-300 pointer-events-auto"></div>
        <div id="cart-panel" class="absolute right-0 top-0 bottom-0 w-full max-w-md bg-white shadow-2xl flex flex-col pointer-events-auto transform translate-x-full transition-transform duration-300">
            <div class="p-6 border-b border-slate-100 flex items-center justify-between">
                <h3 class="text-lg font-bold text-brand-dark" data-translate="cart.title"></h3>
                <button onclick="toggleCartDrawer()" class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-50">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <div id="cart-items" class="p-6 flex-grow overflow-y-auto space-y-4"></div>
            <div class="p-6 border-t border-slate-100 bg-slate-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-sm font-semibold text-slate-500" data-translate="cart.estimated_price"></span>
                    <span id="cart-total-price" class="text-xl font-black text-brand-dark">0 €</span>
                </div>
                <form id="checkout-form" onsubmit="handleCheckout(event)" class="space-y-3">
                    <input type="text" id="checkout-name" required data-translate-placeholder="cart.checkout_name_placeholder" class="w-full bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-green">
                    <input type="email" id="checkout-email" required data-translate-placeholder="cart.checkout_email_placeholder" class="w-full bg-white border border-slate-200 rounded-lg px-3.5 py-2.5 text-sm focus:outline-none focus:border-brand-green">
                    <button type="submit" class="w-full bg-brand-dark hover:bg-slate-800 text-white font-bold py-3 rounded-lg text-sm transition-colors" data-translate="cart.checkout_submit"></button>
                </form>
            </div>
        </div>
    </div>

    <!-- Pätička -->
    <footer class="bg-slate-950 text-slate-500 py-8 text-xs mt-auto">
        <div class="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <p data-translate="footer.copyright"></p>
            <p class="text-slate-600" data-translate="footer.tagline"></p>
        </div>
    </footer>

    <!-- Skripty -->
    <script>
        const mobileMenuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const hamburgerIcon = document.getElementById('hamburger-icon');

        mobileMenuBtn.addEventListener('click', () => {
            const isHidden = mobileMenu.classList.contains('hidden');
            if (isHidden) {
                mobileMenu.classList.remove('hidden');
                hamburgerIcon.setAttribute('d', 'M6 18L18 6M6 6l12 12');
            } else {
                mobileMenu.classList.add('hidden');
                hamburgerIcon.setAttribute('d', 'M4 6h16M4 12h16M4 18h16');
            }
        });

        // Dropdown pre výber jazyka
        const langMenuBtn = document.getElementById('lang-menu-btn');
        const langDropdown = document.getElementById('lang-dropdown');

        langMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeDropdowns();
            langDropdown.classList.toggle('hidden');
        });

        // Dropdown pre Obnoviteľnú energiu (Desktop)
        const renewableMenuBtn = document.getElementById('renewable-menu-btn');
        const renewableDropdown = document.getElementById('renewable-dropdown');

        renewableMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            closeDropdowns();
            renewableDropdown.classList.toggle('hidden');
        });

        // Akordeón pre Obnoviteľnú energiu (Mobile)
        const mobileRenewableMenuBtn = document.getElementById('mobile-renewable-menu-btn');
        const mobileRenewableSubmenu = document.getElementById('mobile-renewable-submenu');

        mobileRenewableMenuBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mobileRenewableSubmenu.classList.toggle('hidden');
        });

        function closeDropdowns() {
            langDropdown.classList.add('hidden');
            renewableDropdown.classList.add('hidden');
        }

        document.addEventListener('click', () => {
            closeDropdowns();
        });

        // Prepínanie tabuľky referencií
        function toggleReferencesTable() {
            const container = document.getElementById('references-container');
            const icon = document.getElementById('ref-btn-icon');
            
            if (container.classList.contains('hidden')) {
                container.classList.remove('hidden');
                icon.classList.add('rotate-180');
            } else {
                container.classList.add('hidden');
                icon.classList.remove('rotate-180');
            }
        }

        // ----------------- LOKALIZAČNÝ ENGINE -----------------
        let currentTranslations = {};
        let currentLang = localStorage.getItem('elvo_lang') || 'sk';

        async function loadLanguage(lang) {
            let fetchedData = null;
            try {
                const response = await fetch(`../../preklad/${lang.toUpperCase()}/index.json`);
                if (response.ok) {
                    fetchedData = await response.json();
                }
            } catch (error) {
                console.warn("Spustené lokálne. Načítava sa vstavaná záloha.");
            }

            if (!fetchedData) {
                fetchedData = fullEmbeddedTranslations[lang];
            }

            currentTranslations = fetchedData;
            applyTranslations(fetchedData, lang);
        }

        function applyTranslations(dictionary, lang) {
            document.querySelectorAll('[data-translate]').forEach(el => {
                const key = el.getAttribute('data-translate');
                const value = getNestedValue(dictionary, key);
                if (value !== undefined) {
                    el.innerHTML = value;
                }
            });

            document.querySelectorAll('[data-translate-placeholder]').forEach(el => {
                const key = el.getAttribute('data-translate-placeholder');
                const value = getNestedValue(dictionary, key);
                if (value !== undefined) {
                    el.setAttribute('placeholder', value);
                }
            });

            document.documentElement.lang = lang;
            document.getElementById('current-lang').innerText = lang.toUpperCase();
            localStorage.setItem('elvo_lang', lang);
            currentLang = lang;

            updateCartUI();
        }

        function changeLang(lang) {
            loadLanguage(lang);
        }

        function getNestedValue(obj, path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        }

        // ----------------- ODOSLANIE DOPYTOVÉHO FORMULÁRA -----------------
        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('form-name').value;
            const email = document.getElementById('form-email').value;
            const phone = document.getElementById('form-phone').value;
            const message = document.getElementById('form-message').value;
            const requestElement = document.getElementById('form-request');
            const requestText = requestElement.options[requestElement.selectedIndex].text;

            const thankMsg = currentLang === 'sk' 
                ? `Ďakujeme za Váš dopyt, ${name}.\nFormulár bol zaznamenaný. Budeme Vás kontaktovať na e-mail ${email} alebo telefónne číslo ${phone} ohľadom: "${requestText}".`
                : `Thank you for your inquiry, ${name}.\nThe form has been submitted. We will contact you at ${email} or ${phone} regarding: "${requestText}".`;

            alert(thankMsg);
            document.getElementById('orc-inquiry-form').reset();
        }

        // ----------------- LOGIKA KOŠÍKA -----------------
        let cart = JSON.parse(localStorage.getItem('elvo_cart')) || [];

        function toggleCartDrawer() {
            const drawer = document.getElementById('cart-drawer');
            const backdrop = document.getElementById('cart-backdrop');
            const panel = document.getElementById('cart-panel');

            if (drawer.classList.contains('hidden')) {
                drawer.classList.remove('hidden');
                setTimeout(() => {
                    backdrop.classList.replace('opacity-0', 'opacity-100');
                    panel.classList.replace('translate-x-full', 'translate-x-0');
                }, 10);
            } else {
                backdrop.classList.replace('opacity-100', 'opacity-0');
                panel.classList.replace('translate-x-0', 'translate-x-full');
                setTimeout(() => {
                    drawer.classList.add('hidden');
                }, 300);
            }
        }

        function changeQuantity(id, delta) {
            const itemIndex = cart.findIndex(item => item.id === id);
            if (itemIndex > -1) {
                cart[itemIndex].quantity += delta;
                if (cart[itemIndex].quantity <= 0) {
                    cart.splice(itemIndex, 1);
                }
                saveCart();
                updateCartUI();
            }
        }

        function removeItem(id) {
            cart = cart.filter(item => item.id !== id);
            saveCart();
            updateCartUI();
        }

        function saveCart() {
            localStorage.setItem('elvo_cart', JSON.stringify(cart));
        }

        function updateCartUI() {
            const cartItemsContainer = document.getElementById('cart-items');
            const cartIconBtn = document.getElementById('cart-icon-btn');
            const cartBadge = document.getElementById('cart-badge');
            const cartTotalPrice = document.getElementById('cart-total-price');

            let totalQuantity = 0;
            let totalPrice = 0;

            cartItemsContainer.innerHTML = '';

            const tEmptyTitle = getNestedValue(currentTranslations, 'cart.empty_title') || 'Váš košík je prázdny';
            const tEmptySubtitle = getNestedValue(currentTranslations, 'cart.empty_subtitle') || 'Pridajte smart riešenia v príslušnej sekcii.';
            const tUnitPrice = getNestedValue(currentTranslations, 'cart.unit_price') || '€ / ks';

            if (cart.length === 0) {
                cartItemsContainer.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-center text-slate-400 py-12">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mb-3 text-slate-300">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 00-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.116 60.116 0 00-16.536-1.84M7.5 14.25L5.106 5.272M6 20.25a.75.75 0 11-1.5 0 .75.75 0 011.5 0zm12.75 0a.75.75 0 11-1.5 0 .75.75 0 011.5 0z" />
                        </svg>
                        <p class="text-sm font-semibold">${tEmptyTitle}</p>
                        <p class="text-xs mt-1">${tEmptySubtitle}</p>
                    </div>
                `;
                cartIconBtn.classList.add('hidden');
            } else {
                cart.forEach(item => {
                    totalQuantity += item.quantity;
                    totalPrice += item.price * item.quantity;

                    const itemElement = document.createElement('div');
                    itemElement.className = "flex items-center gap-4 bg-slate-50 p-3.5 rounded-2xl border border-slate-100 relative text-xs";
                    itemElement.innerHTML = `
                        <img src="${item.img}" alt="${item.name}" class="w-12 h-12 object-cover rounded-lg bg-white border border-slate-100">
                        <div class="flex-grow">
                            <h4 class="font-bold text-brand-dark leading-tight">${item.name}</h4>
                            <p class="text-slate-500 mt-0.5">${item.price} ${tUnitPrice}</p>
                            
                            <div class="flex items-center gap-2 mt-1.5">
                                <button onclick="changeQuantity('${item.id}', -1)" class="w-5 h-5 bg-white hover:bg-slate-100 border border-slate-200 text-xs font-bold rounded flex items-center justify-center">-</button>
                                <span class="font-bold text-slate-700 w-4 text-center">${item.quantity}</span>
                                <button onclick="changeQuantity('${item.id}', 1)" class="w-5 h-5 bg-white hover:bg-slate-100 border border-slate-200 text-xs font-bold rounded flex items-center justify-center">+</button>
                            </div>
                        </div>
                        <button onclick="removeItem('${item.id}')" class="absolute top-2.5 right-2.5 text-slate-400 hover:text-red-500 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25) 0 01-2.244 2.077H8.084a2.25 2.25) 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
                            </svg>
                        </button>
                    `;
                    cartItemsContainer.appendChild(itemElement);
                });

                cartIconBtn.classList.remove('hidden');
                cartBadge.innerText = totalQuantity;
            }

            const formatterLang = currentLang === 'sk' ? 'sk-SK' : 'en-US';
            cartTotalPrice.innerText = `${totalPrice.toLocaleString(formatterLang)} €`;
        }

        function handleCheckout(event) {
            event.preventDefault();
            const name = document.getElementById('checkout-name').value;
            const email = document.getElementById('checkout-email').value;

            if (cart.length === 0) return;

            let itemsSummary = cart.map(item => `- ${item.name} (${item.quantity}x)`).join('\n');

            const dictionary = currentTranslations || fullEmbeddedTranslations[currentLang] || fullEmbeddedTranslations['sk'];
            const alertThankYou = getNestedValue(dictionary, 'cart.alert_thank_you') || "Ďakujeme za váš dopyt, {name}!";
            const alertReceived = getNestedValue(dictionary, 'cart.alert_received') || "Na e-mail {email} sme zaznamenali záujem o produkty:";
            const alertContact = getNestedValue(dictionary, 'cart.alert_contact') || "Čoskoro vás budeme kontaktovať.";

            const formattedThankYou = alertThankYou.replace('{name}', name);
            const formattedReceived = alertReceived.replace('{email}', email);

            alert(`${formattedThankYou}\n\n${formattedReceived}\n${itemsSummary}\n\n${alertContact}`);
            
            cart = [];
            saveCart();
            updateCartUI();
            toggleCartDrawer();
            document.getElementById('checkout-form').reset();
        }

        document.addEventListener("DOMContentLoaded", () => {
            loadLanguage(currentLang);
        });
